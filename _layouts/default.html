<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">

  {% include head.html %}

  <body data-baseurl="{{ site.baseurl }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include icons.svg %}

    {% include header.html %}

    <main id="main" class="site-container">
      {{ content }}
    </main>

    {% unless page.url == '/' %}
      {% include footer.html %}
    {% endunless %}

    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>

  </body>

</html>
