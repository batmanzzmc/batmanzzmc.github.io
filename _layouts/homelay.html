---
layout: default
---

<div class="home-grid">
  <div class="home-sidebar">
    {% include sidebar.html %}
  </div>

  <div class="home-content">
    {{ content }}

    {% if site.data.news.size > 0 %}
    <section class="home-news" aria-labelledby="home-news-title" style="margin-top: var(--space-8);">
      <h2 id="home-news-title">News</h2>
      <div class="news-timeline">
        {% for article in site.data.news %}
        <div class="news-item">
          <div class="news-date">{{ article.date }}</div>
          <div class="news-headline">{{ article.headline }}</div>
        </div>
        {% endfor %}
      </div>
    </section>
    {% endif %}

    {% include visitor-counter.html %}
  </div>

</div>
